<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Alien explosion</title>

		<link rel='stylesheet' type='text/css' href='alienExplosion.css'/>
	</head>
	<body>

		<div id="stage">
			<div id="background"></div>
			<div id="cannon"></div>
			<div id="missile"></div>
			<div id="alien"></div>
			<div id="explosion"></div>
		</div>

		<p id="output">

		</p>
		<input id="inputX" type="text" placeholder="X…">
		<input id="inputY" type="text" placeholder="Y…">
		<button>
			fire!
		</button>

		<script src="alienExplosion.js"></script>
	</body>
</html>
