<!DOCTYPE HTML>
<meta charset="utf-8">
<html>

<head>

    <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:400italic,600italic,700italic,200,300,400,600,700,900">
    <script src="https://d3js.org/d3.v5.min.js"></script>
    <script src="https://d3js.org/topojson.v2.min.js"></script>

    <style>
        body,
        h1,
        h2,
        h3,
        p {
            margin: 0;
            padding: 0;
            font-family: 'Source Sans Pro', sans-serif;
            font-size: 1em;
            color: #333;
            font-weight: 400;
        }
        
        #content {
            margin: 5px;
            padding: 20px;
            width: 100%;
            border: 1px solid #ccc;
        }
        
        #map {
            margin: 10px 0px 0px 0px;
            padding: 0px;
        }
        
        h1,
        h2 {
            line-height: 1em;
            font-size: 1.75em;
            font-weight: 900;
            color: #000;
        }
        
        h2.year {
            margin: 10px 0px 0px 0px;
            font-size: 1.3em;
            font-weight: 700;
        }
        
        p {
            margin: 10px 0px 0px 0px;
        }
        
        .county {
            fill: #fff;
        }
        
        .states {
            fill: none;
            stroke: #fff;
            stroke-linejoin: round;
        }
        
        input {
            display: block;
            width: 200px;
            margin: 10px 0px 0px 0px;
        }
        
        #legend text {
            font-size: 0.9em;
            color: #333;
            font-weight: 400;
        }
        
        .tooltip {
            position: absolute;
            padding: 7px;
            font-size: 0.9em;
            pointer-events: none;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            -moz-box-shadow: 3px 3px 10px 0px rgba(0, 0, 0, 0.25);
            -webkit-box-shadow: 3px 3px 10px 0px rgba(0, 0, 0, 0.25);
            box-shadow: 3px 3px 10px 0px rgba(0, 0, 0, 0.25);
        }
        
        .tooltip p {
            margin: 0;
            padding: 0;
        }
        
        .tooltip table {
            margin: 0;
            padding: 0;
            border-collapse: collapse;
        }
        
        .wide {
            width: 140px;
        }
    </style>

</head>

<body>

    <div id="content">
        <h1>U.S. Covid-19 Cases</h1>
        <div id = "dates"></div>
        <h5>(mouseover for details, double-click (or mouse wheel) to zoom, click and drag)</h5>
        <h2 class="year"></h2>
        <div class="slider"></div>
        <div id="map"></div>
        <p><a href="https://github.com/nytimes/covid-19-data">Data Source: New York Times (GitHub)<a/></p>
<p>Graphic: Myles Callan (based on <a href="http://bl.ocks.org/dougdowson/9832019">Doug Dowson’s Block 9832019</a>)</p>
    </div>

    <script>
        /*********************************************************************************/
        /*                        Mar 28, 2020 Added All Country and State Names         */
        /*********************************************************************************/
        var width = window.innerWidth / 1.25,
            height = window.innerHeight / 1.25;

        var fill = d3.scaleLog()
            .domain([10, 500])
            .range(["brown", "steelblue"]);

        var path = d3.geoPath();

        var margin = {
            top: 20,
            right: 20,
            bottom: 20,
            left: 20
        };
        var formatPercent = d3.format(".1%");

        const zoom = d3.zoom()
            .scaleExtent([1, 8])
            .on('zoom', zoomed);

        var svg = d3.select("#map").append("svg")
            .attr("width", width + margin.left + margin.right)
            .attr("height", height + margin.top + margin.bottom)
            .append("g")
            .attr("transform", "translate(" + margin.left + "," + margin.top + ")");
            
        const g = svg.append('g');

        svg.call(zoom);

        tooltip = d3.select("body").append("div")
            .attr("class", "tooltip")
            .style("opacity", 0);

        var legendText = ["0", "1", "5", "10", "25", "50", "100", "500", ">500"];
        var RdYlBu = ["#d73027", "#f46d43", "#fdae61", "#fee090", "#ffffbf", "#e0f3f8", "#abd9e9", "#74add1", "#4575b4"].reverse()
        var legendColorScale = d3.scaleOrdinal()
            .domain(legendText)
            .range(RdYlBu)

        //         legendText.forEach( d => console.log(legendColorScale(d)) )     

        //         console.log("legendText", legendText)

        d3.json("us.txt").then(us => {
            d3.csv("https://raw.githubusercontent.com/nytimes/covid-19-data/master/us-counties.csv").then(data => {
                d3.csv("FIPs_TopoJSON.txt").then(fipsData => {

                    var counties = topojson.feature(us, us.objects.counties);

                   var parser = d3.timeParse("%Y-%m-%d");
                    var formatDayWeek = d3.timeFormat("%A, %d of %B, %Y");
                    var formatDay = d3.timeFormat("%A");

                    console.log(counties)

                    data.forEach(function(d) {
                        d.date = parser(d['date']);
                        d.day = formatDay(d.date);
                        d.days = formatDayWeek(d.date);
                        d.deaths = +d.deaths;
                        d.fips = +d.fips;
                        d.cases = +d.cases;
                        d.casesScale = d.cases < 1 ? 0 : d.cases <= 1 ? 1 : d.cases <= 5 ? 5 : d.cases <= 10 ? 10 : d.cases <= 25 ? 25 : d.cases <= 50 ? 50 : d.cases <= 100 ? 100 : d.cases <= 500 ? 500 : 501;
                    });

                    // Get unique dates
                    var dates = [...new Set(data.map(d => d['date']))]
                    
                    // Get earliest and latest dates 
                    var datesExtant =[{
                    min: d3.min(dates),
                    minText: formatDayWeek(d3.min(dates)),
                    max: d3.max(dates),
                    maxText: formatDayWeek(d3.max(dates))}]
                    
                    console.log("datesExtant: ", datesExtant)
                    
                    // Add dates to html
                    d3.select("#dates")
                       .data(datesExtant)
                        .attr("x", width - 240)
                        .attr("y", -10)
                        .style("text-anchor", "middle")
                        .style("color", "black")
                        .text(d => "Most Recent Entry: " + d.maxText);

                    // For each fips, only selected the oldest date:
                    const filteredArray = Object.values(data.reduce((unique, o) => {
                        if (!unique[o.fips] || +o.date > +unique[o.fips].date) unique[o.fips] = o;

                        return unique;
                    }, {}));

                    var countyByFips = d3.nest()
                        .key(d => d["FIPS"])
                        .map(fipsData);

                    console.log("data", data)
                    console.log("filteredArray", filteredArray)
                    console.log("fipsData", fipsData)
                    console.log("countyByFips", countyByFips)

                    var dataByCountyByCases = d3.nest()
                        .key(d => d.fips)
                        .map(filteredArray);

                    //                 console.log("us", us)
                    console.log("dataByCountyByCases", dataByCountyByCases)

                    counties.features.forEach(function(county) {
                        console.log("countyByFips.get(county.id)", countyByFips.get(county.id))
                        if (dataByCountyByCases.has(county.id)) {
                            county.properties.cases = dataByCountyByCases.get(county.id)
                        } else if (countyByFips.has(county.id)) {
                            county.properties.cases = [{
                                date: "NA",
                                county: countyByFips.get(county.id)[0].AreaName,
                                state: countyByFips.get(county.id)[0].State,
                                fips: +county.id,
                                cases: "NA",
                                deaths: "NA",
                                casesScale: "NA"
                            }]

                        } else {
                            county.properties.cases = [{
                                date: "NA",
                                county: "NA",
                                state: "NA",
                                fips: +county.id,
                                cases: "NA",
                                deaths: "NA",
                                casesScale: "NA"
                            }]

                        }
                    });

                    console.log("counties.features", counties.features)

                    var colorDomain = [...new Set(data.map(d => d['casesScale']))]

                    var color = d3.scaleOrdinal()
                        .domain(colorDomain)
                        .range(RdYlBu)

                    console.log("color(5): ", color(5))

                    var projection = d3.geoAlbersUsa()
                        .translate([width / 2, height / 2]);

                    var path = d3.geoPath()
                        .projection(projection);

                    var countyShapes = g.selectAll(".county")
                        .data(counties.features)
                        .enter()
                        .append("path")
                        .attr("class", "county")
                        .attr("d", path)
                        .style('fill', d => d.properties.cases[0].cases === "NA" ? "#f3f3f4" : color(d.properties.cases[0].casesScale))
                        //                     .attr("fake", d => console.log(d.properties.cases[0].cases === "NA" ? "rgb(255,255,255)": color(d.properties.cases[0].casesScale)));

                    countyShapes
                        .on("mouseover", function(d) {
                            tooltip.transition()
                                .duration(250)
                                .style("opacity", 1);
                            tooltip.html(
                                    "<p><strong>" + d.properties.cases[0].county + ", " + d.properties.cases[0].state + "</strong></p><br><p><strong>Cases: " +
                                    d.properties.cases[0].cases + ", Deaths: " + d.properties.cases[0].deaths + "</strong></p>")
                                .style("left", (d3.event.pageX + 15) + "px")
                                .style("top", (d3.event.pageY - 28) + "px");
                        })
                        .on("mouseout", function(d) {
                            tooltip.transition()
                                .duration(250)
                                .style("opacity", 0);
                        });

                    g.append("path")
                        .datum(topojson.feature(us, us.objects.states, function(a, b) {
                            return a !== b;
                        }))
                        .attr("class", "states")
                        .attr("d", path);

                    // Legend 
                    var legend = g.append("g")
                        .attr("id", "legend");

                    var legenditem = g.selectAll(".legenditem")
                        .data(legendText)
                        .enter()
                        .append("g")
                        .attr("class", "legenditem")
                        .attr("transform", function(d, i) {
                            return "translate(" + i * 30 + ",0)";
                        });

                    legenditem.append("rect")
                        .attr("x", width - 240)
                        .attr("y", -7)
                        .attr("width", 30)
                        .attr("height", 6)
                        .attr("class", "rect")
                        .style("fill", d => legendColorScale(d))

                    legenditem.append("text")
                        .attr("x", width - 240)
                        .attr("y", -10)
                        .style("text-anchor", "middle")
                        .text(d => d);

                    //   function update(death) {
                    //                     slider.property("value", death);
                    //                     d3.select(".year").text(death);
                    //                     countyShapes
                    // //                         .attr("fake", (d, i) => console.log(i, d.properties.deaths[death][0].cases))
                    //                         .style("fill", d =>  color(d.properties.deaths[death][0].cases))
                    //                 }
                    // 
                    //                 var slider = d3.select(".slider")
                    //                     .append("input")
                    //                     .attr("type", "range")
                    //                     .attr("min", d3.min(data, d => +d.deaths))
                    //                     .attr("max", d3.max(data, d => +d.deaths))
                    //                     .attr("step", 1)
                    //                     .on("input", function() {
                    //                         var death = this.value;
                    //                         update(death);
                    //                     });
                    // 
                    //                 update(d3.min(data, d => +d.deaths));
                });
            });
        });

        function zoomed() {
            g
                .selectAll('path') // To prevent stroke width from scaling
                .attr('transform', d3.event.transform);
        }
    </script>
</body>

</html>
