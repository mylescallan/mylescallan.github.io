<!DOCTYPE HTML>
<meta charset="utf-8">

<head>

    <style>
        html {

        }
        
        body {

#content {

}

        #content {

            padding: 20px;

            height: 90%;

        }
        
        #map {
            width: 75vw;

        }

        }
        
        #legend text {

            color: #333;
            font-weight: 400;
        }

            padding: 7px;
            font-size: 0.9em;
            pointer-events: none;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            -moz-box-shadow: 3px 3px 10px 0px rgba(0, 0, 0, 0.25);

        }

        }
        
        a#main:visited {
            background-color: #ccc;
        }

        #play-button {
            position: absolute;
            top: 180px;
            left: 30px;
            background: rgb(244, 109, 67);
            padding-right: 26px;
            border-radius: 3px;
            border: none;
            color: white;
            margin: 0;
            padding: 0 12px;
            width: 100px;
            cursor: pointer;
            height: 20px;

                    // Source: https://weeknumber.net/how-to/javascript

                    // Returns the ISO week of the date.
                    Date.prototype.getWeek = function() {
                        var date = new Date(this.getTime());
                        date.setHours(0, 0, 0, 0);
                        // Thursday in current week decides the year.
                        date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
                        // January 4 is always in week 1.
                        var week1 = new Date(date.getFullYear(), 0, 4);
                        // Adjust to Thursday in week 1 and count number of weeks from date to week1.
                        return 1 + Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
                    }

                    var parser = d3.timeParse("%Y-%m-%d");
                    var formatDate = d3.timeFormat("%Y-%m-%d");
                    var formatDayWeek = d3.timeFormat("%A, %d of %B, %Y");
                    var formatWeekDict = d3.timeFormat("Week of %A, %d of %B, %Y");

                    fipsData.forEach(function(d) {

                    // filter out any FIPS that are not 5 digits
                    data = data.filter(d => d.fips.length === 5);
                    // filter out any FIPS that are not 5 digits
                    fipsData = fipsData.filter(d => d.FIPS.length === 5);

                    console.log("fipsData ", fipsData)
                    console.log("data ", data)

                    /************************************************************/
                    /*             Add Date Information to HTML                 */
                    /************************************************************/
                    // Get unique dates
                    var days = [...new Set(data.map(d => d['day']))]
                    var dates = [...new Set(data.map(d => d['date']))]
                        //                    const uniqueDates = dates.filter((date, i, self) => 
                        //                               self.findIndex(d => d.getTime() === date.getTime()) === i

                        //                     console.log("dates number", days.length)

                    console.log("datesExtant: ", datesExtant)

                    /************************************************************/

                    /************************************************************/

                    // Create an object: Key = FIPS Values = State and County Name
                    var countyByFips = d3.nest()

                    //                         if (!countyByFips.get(fipsData[ind].FIPS)){
                    //                             console.log("This fips is missing: ",fipsData[ind].FIPS )}}

                    /****************************************************************/
                    /* Step One: Not all FIPS are in the dataset                    */
                    /*           Add All FIPS to  dataset (key/value pairs)         */
                    /*                   Add State and County Name (FOR ALL WEEKS)  */
                    /*           For All FIPS ensure that there is week data        */
                    /*                   Replicate                                  */
                    /****************************************************************/

                    // make deep copy of object
                    const deepCopyFunction = inObject => {
                            let outObject, value, key

                            if (typeof inObject !== "object" || inObject === null) {
                                return inObject // Return the value if inObject is not an object
                            }

                            // Create an array or object to hold the values
                            outObject = Array.isArray(inObject) ? [] : {}

                            for (key in inObject) {
                                value = inObject[key]

                                // Recursively (deep) copy for nested objects, including arrays
                                outObject[key] = (typeof value === "object" && value !== null) ? deepCopyFunction(value) : value
                            }

                            return outObject
                        }
                        // Functions to create empty entries

                    function emptyDaysEntries(fips, d = [...days]) {
                        //                             console.log(fips);
                        var base = {
                            day: d[0],

                            cases: "N/A",
                            deaths: "N/A",

                        };
                        //                         console.log(base);

                        var entries = [base];
                        // remove first entry (used for base)
                        d.shift()
                            // loop over weeks
                        if (d.length > 0) {
                            d.forEach(function(w) {
                                // create a deep copy of base
                                var newbase = deepCopyFunction(base);
                                // change only relevant values
                                newbase.day = w;
                                entries.push(newbase);
                                //                                 console.log(entries);
                            });
                        }
                        return entries;
                    }

                    /************************************************************/

                    /************************************************************/

                    var featureFips = [...new Set(counties.features.map(d => d['id']))].sort()

                    console.log("FIPS in features", featureFips)

                    // Unique FIPS in fipsData 
                    var fipsFips = [...new Set(fipsData.map(d => d['FIPS']))].sort()
                    console.log("Number of FIPS", fipsFips.length)
                    console.log("FIPS", fipsFips)

                    // Create an object: Key = NUMERIC FIPS Values = State and County Name
                    var countyByFipsNum = d3.nest()
                        .key(d => +d["FIPS"])
                        .map(fipsData);
                    console.log("countyByFips: ", countyByFipsNum)

                    // Unique Numeric FIPS in fipsData 
                    var fipsFipsNum = [...new Set(fipsData.map(d => +d['FIPS']))].sort()
                    console.log("Number of FIPS", fipsFipsNum.length)
                    console.log("FIPS", fipsFipsNum)

                    //                     By FIPS add State and County Name to counties.features.cases
                    var partInd = 0,
                        compInd = 0,
                        empInd = 0;
                    counties.features.forEach(function(d) {
                        if (fipsFipsNum.includes(d.id)) {
                            d.county = countyByFipsNum.get(d.id)[0].AreaName;
                            d.state = countyByFipsNum.get(d.id)[0].State;
                        }
                    })
                    console.log("counties.features: ", counties.features)

                    // Remove (Filter) any features that don't have a county
                    counties.features = counties.features.filter(({
                        county
                    }) => county);

                    // fips in counties.features are strings
                    data.forEach(d => d.fips = +d.fips)

                    /************************************************************/
                    /* Step Two: Get Daily Data                                */
                    /************************************************************/

                    // OLD VERSION: For each fips, only selected the oldest date:
                    //                     const filteredArray = Object.values(data.reduce((unique, o) => {
                    //                         if (!unique[o.fips] || +o.date > +unique[o.fips].date) unique[o.fips] = o;
                    // 
                    //                         return unique;
                    //                     }, {}));

                    //                     console.log("fipsData", fipsData)
                    //                     console.log("countyByFips", countyByFips)

                    var dataByCountyByCasesWeekly = d3.nest()
                        .key(d => d.fips)
                        .key(d => d.day)
                        .map(data);

                    var totalCases = d3.nest()
                        .key(d => d.day)
                        .rollup(function(v) {
                            return {
                                count: v.length,
                                "totalCases": d3.sum(v, function(d) {
                                    return d.cases;
                                }),
                                "totalDeaths": d3.sum(v, function(d) {
                                    return d.deaths;
                                })
                            };
                        })
                        .entries(data);

                    // Add weeks object to features for each id
                    counties.features.forEach(function(county) {
                        county.properties.days = dataByCountyByCasesWeekly.get(county.id)
                    });
                    /************************************************************/
                    /*      Create The Visualization                            */

                    d3.select("#dates")

                        .style("color", "black")

                            "<br>(<b>Latest Totals From Data Source</b> - Cases: " + totalCases[totalCases.length - 1].value["totalCases"] + ", Deaths: " +
                            totalCases[totalCases.length - 1].value["totalDeaths"] + ")")

                    //                     Check that each days has 69 objects
                    //                     weeksCount = {}
                    //                     counties.features.forEach(function(d) {
                    //                             weekLen = Object.keys(d.properties.days).length;
                    //                             if (weekLen != 69){
                    //                             weeksCount[d.id] = weekLen;
                    //                             }
                    //                     })
                    // //                     
                    //                     console.log("weeksCount: ", weeksCount)

                    //                     var dataFeatures = [...new Set(counties.features.map(d => d['id']))]
                    //                     console.log("Number of FIPS in features", dataFeatures.length)
                    //                     console.log("FIPS in features", dataFeatures.sort())

                    //                     console.log("data filter for states", finalData.filter(d => d.id === 25027))

                    /************************************************************/
                    /*    Tool tips and color scale for missing data            */
                    /************************************************************/

                    // Some Days May Not Have Entries
                    function tooltipText(d, obj, day) {
                        if (typeof obj != 'undefined') {
                            if (obj.has(day)) {
                                return "<p><strong>" +

                            } else {
                                return "<p><strong>" + d.county + ", " + d.state + "</strong></p><br><p><strong>Cases: N/A, Deaths: N/A </strong></p>"
                            }
                        } else {
                            return "<p><strong>" + d.county + ", " + d.state + "</strong></p><br><p><strong>Cases: N/A, Deaths: N/A </strong></p>"

                                return color(obj.get(day)[0].casesScale)
                            } else {

                            }
                        } else {

                        }

                    var colorDomain = [...new Set(data.map(d => d['casesScale']))]
                    
                    console.log( "colorDomain", colorDomain)

//                     console.log("RdYlBu.len", RdYlBu.length)

                        var i = setInterval(function() {
                            // do your thing

                            console.log(i)
                            counter++;

                                // timer = 0;
                                button.text("Resume");

                                moving = true;
                                loopDays();
                                button.text("Pause");
                            }
                        })

                    function resize() {
                        // adjust things when the window size changes
                        width = parseInt(d3.select('#map').style('width'));
                        width = width - margin.left - margin.right;
                        height = width * mapRatio;

                        // update projection
                        projection
                            .translate([width / 2, height / 2])
                            .scale(width);

                        // resize the map container
                        map
                            .style('width', width + 'px')
                            .style('height', height + 'px');

                        // resize the map
                        map.select('.land').attr('d', path);
                        map.selectAll('.state').attr('d', path);
                    }

                });
            });
        });

        // add zoom functionality
        function zoomed() {
            g
                .selectAll('path') // To prevent stroke width from scaling
                .attr('transform', d3.event.transform);
            d3.select(window).on('resize', resize);

        }
    </script>
</body>
